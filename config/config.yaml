kafka:
  bootstrap_servers: "localhost:9092"
  topic: "user-events"
  group_id: "preferredtime-raw-events-v1"
  auto_offset_reset: "earliest"
  partitions: 3

s3:
  region: "us-east-1"
  raw_events_bucket: "preferredtime-data"
  raw_events_prefix: "raw/user-events/"
  model_bucket: "preferredtime-models"

model:
  positive_threshold: 4.0
  max_candidates: 500
  top_n: 20
  mmr_relevance_weight: 0.8
  p99_budget_ms: 100

api:
  host: "0.0.0.0"
  port: 8082
